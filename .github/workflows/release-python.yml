# Manual release for python-sdk → PyPI (kubit-otel)
# Parity: when releasing a stable version, dispatch release-nodejs.yml with the same version.
name: Release python-sdk

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, X.Y.Z only (e.g. 0.8.0). Do not include rc suffix.'
        required: true
        type: string
      release_type:
        description: 'public = stable X.Y.Z;  pre-release = X.Y.ZrcN'
        required: true
        type: choice
        default: public
        options:
          - public
          - pre-release
      rc_number:
        description: 'RC number (used only when release_type = pre-release; ignored otherwise)'
        required: false
        type: string
        default: '1'
      dry_run:
        description: 'Dry run: build + validate but do not publish, commit, or tag'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-python
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: python-sdk

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve and validate version
        id: resolve
        working-directory: .
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RC_NUMBER: ${{ inputs.rc_number }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION_INPUT (must be X.Y.Z, with no rc/pre-release suffix)."
            exit 1
          fi
          if [[ "$RELEASE_TYPE" == "pre-release" ]]; then
            if [[ ! "$RC_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "Invalid rc_number: $RC_NUMBER (must be a positive integer)."
              exit 1
            fi
            FULL_VERSION="${VERSION_INPUT}rc${RC_NUMBER}"
          else
            FULL_VERSION="$VERSION_INPUT"
          fi

          CUR_VERSION=$(grep -E '^version = ' python-sdk/pyproject.toml | sed -E 's/^version = "([^"]+)"/\1/')
          echo "Current version in pyproject.toml: $CUR_VERSION"
          echo "Proposed version:                  $FULL_VERSION"

          python -m pip install --quiet packaging
          python - <<PYEOF
          from packaging.version import Version
          import sys
          new = Version("$FULL_VERSION")
          cur = Version("$CUR_VERSION")
          if new <= cur:
              sys.exit(f"Refusing to release: proposed {new} is not greater than current {cur}.")
          print(f"OK: {new} > {cur}")
          PYEOF

          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist
        working-directory: .
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          TAG="python-sdk-v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi
          echo "Tag $TAG is free."

      - name: Bump version in pyproject.toml
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          sed -i.bak -E 's/^version = "[^"]+"/version = "'"$VERSION"'"/' pyproject.toml
          rm pyproject.toml.bak
          grep -E '^version = ' pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build twine
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate built artifacts
        run: twine check dist/*

      - name: Upload build artifacts to run
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist-${{ steps.resolve.outputs.version }}
          path: python-sdk/dist/*
          if-no-files-found: error

      - name: Publish to PyPI
        if: ${{ inputs.dry_run == false }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --non-interactive dist/*

      - name: Commit, tag, and push
        if: ${{ inputs.dry_run == false }}
        working-directory: .
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add python-sdk/pyproject.toml
          git commit -m "Release python-sdk v$VERSION"
          git tag "python-sdk-v$VERSION"
          git push origin HEAD:master
          git push origin "python-sdk-v$VERSION"

      - name: Dry-run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Dry run complete. Would have published kubit-otel ${{ steps.resolve.outputs.version }} to PyPI"
          echo "and tagged python-sdk-v${{ steps.resolve.outputs.version }}. No external side-effects performed."
