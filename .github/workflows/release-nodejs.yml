# Manual release for nodejs-sdk → npm (@kubit-ai/otel)
# Parity: when releasing a stable version, dispatch release-python.yml with the same version.
name: Release nodejs-sdk

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release. Stable: X.Y.Z (e.g. 0.8.0). Pre-release: X.Y.Z-rc.N (e.g. 0.8.0-rc.1).'
        required: true
        type: string
      dry_run:
        description: 'Dry run: build + validate but do not publish, commit, or tag'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-nodejs
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: nodejs-sdk

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      dist_tag: ${{ steps.validate.outputs.dist_tag }}
    steps:
      - name: Validate version (stable X.Y.Z or pre-release X.Y.Z-rc.N) and pick npm dist-tag
        id: validate
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Accepted forms: X.Y.Z (stable) or X.Y.Z-rc.N (release candidate, e.g. 0.8.0-rc.1)."
            exit 1
          fi
          if [[ "$VERSION" == *-rc.* ]]; then
            DIST_TAG=next
          else
            DIST_TAG=latest
          fi
          echo "Version $VERSION accepted; npm dist-tag = $DIST_TAG"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag does not already exist
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: |
          TAG="nodejs-sdk-v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi
          echo "Tag $TAG is free."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Bump version in package.json
        env:
          VERSION: ${{ inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: npm publish dry-run (validation)
        run: npm publish --access public --tag "${{ steps.validate.outputs.dist_tag }}" --dry-run

      - name: Pack tarball for artifact upload
        run: npm pack

      - name: Upload build artifacts to run
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-sdk-dist-${{ inputs.version }}
          path: |
            nodejs-sdk/*.tgz
            nodejs-sdk/dist/**
          if-no-files-found: error

      - name: Publish to npm
        if: ${{ inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag "${{ steps.validate.outputs.dist_tag }}"

      - name: Commit, tag, and push
        if: ${{ inputs.dry_run == false }}
        working-directory: .
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodejs-sdk/package.json nodejs-sdk/package-lock.json
          git commit -m "Release nodejs-sdk v$VERSION"
          git tag "nodejs-sdk-v$VERSION"
          git push origin HEAD:master
          git push origin "nodejs-sdk-v$VERSION"

      - name: Dry-run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Dry run complete. Would have published @kubit-ai/otel ${{ inputs.version }}"
          echo "to npm with dist-tag '${{ steps.validate.outputs.dist_tag }}'"
          echo "and tagged nodejs-sdk-v${{ inputs.version }}. No external side-effects performed."
