# Manual release for nodejs-sentry-sdk → npm (@kubit-ai/sentry)
#
# Publishes via npm trusted publishing (OIDC) — there is no NPM_TOKEN. The trust
# relationship is configured on npmjs.com under the package's Trusted Publisher
# settings and must name THIS file (release-sentry-nodejs.yml) exactly. Renaming this
# file breaks publishing until the npm side is updated to match.
name: Release sentry nodejs-sdk

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, X.Y.Z only (e.g. 0.4.0). Do not include rc suffix.'
        required: true
        type: string
      release_type:
        description: 'public = stable X.Y.Z (dist-tag latest);  pre-release = X.Y.Z-rc.N (dist-tag next)'
        required: true
        type: choice
        default: pre-release
        options:
          - pre-release
          - public
      rc_number:
        description: 'RC number (used only when release_type = pre-release; ignored otherwise)'
        required: false
        type: string
        default: '1'
      dry_run:
        description: 'Dry run: build + validate but do not publish, commit, or tag'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-sentry-nodejs
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  # Force any Node-20-based JS actions (e.g. upload-artifact@v5) onto Node 24
  # until they ship a Node-24 release. Becomes default June 2 2026.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

defaults:
  run:
    working-directory: nodejs-sentry-sdk

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      dist_tag: ${{ steps.validate.outputs.dist_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; the npm bundled with Node 24 may
      # be older depending on the runner image.
      - name: Ensure npm supports trusted publishing
        working-directory: .
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      - name: Resolve and validate version, pick npm dist-tag
        id: validate
        working-directory: .
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          RC_NUMBER: ${{ inputs.rc_number }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION_INPUT (must be X.Y.Z, with no rc/pre-release suffix)."
            exit 1
          fi
          if [[ "$RELEASE_TYPE" == "pre-release" ]]; then
            if [[ ! "$RC_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "Invalid rc_number: $RC_NUMBER (must be a positive integer)."
              exit 1
            fi
            FULL_VERSION="${VERSION_INPUT}-rc.${RC_NUMBER}"
            DIST_TAG=next
          else
            FULL_VERSION="$VERSION_INPUT"
            DIST_TAG=latest
          fi

          # Validate against what is actually published on npm, not against the
          # working tree: releases of this package have historically been cut by
          # hand, so package.json can lag the registry.
          PUBLISHED=$(npm view @kubit-ai/sentry version 2>/dev/null || echo "0.0.0")
          echo "Latest published on npm: $PUBLISHED"
          echo "Proposed version:        $FULL_VERSION (release_type=$RELEASE_TYPE, dist-tag=$DIST_TAG)"

          if ! npx --yes semver --include-prerelease -r ">$PUBLISHED" "$FULL_VERSION" >/dev/null 2>&1; then
            echo "Refusing to release: proposed $FULL_VERSION is not greater than published $PUBLISHED."
            exit 1
          fi
          echo "OK: $FULL_VERSION > $PUBLISHED"

          echo "version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist
        working-directory: .
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          TAG="sentry-v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi
          echo "Tag $TAG is free."

      - name: Bump version in package.json
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build:all

      - name: npm publish dry-run (validation)
        run: npm publish --access public --tag "${{ steps.validate.outputs.dist_tag }}" --dry-run

      - name: Pack tarball for artifact upload
        run: npm pack

      - name: Upload build artifacts to run
        uses: actions/upload-artifact@v5
        with:
          name: sentry-sdk-dist-${{ steps.validate.outputs.version }}
          path: |
            nodejs-sentry-sdk/*.tgz
            nodejs-sentry-sdk/dist/**
          if-no-files-found: error

      # No NODE_AUTH_TOKEN: authentication is via the OIDC trust configured on
      # npmjs.com. Provenance is generated automatically for this public repo.
      - name: Publish to npm (trusted publishing / OIDC)
        if: ${{ inputs.dry_run == false }}
        run: npm publish --access public --tag "${{ steps.validate.outputs.dist_tag }}"

      - name: Commit, tag, and push
        if: ${{ inputs.dry_run == false }}
        working-directory: .
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodejs-sentry-sdk/package.json nodejs-sentry-sdk/package-lock.json
          git commit -m "Release sentry-sdk v$VERSION"
          git tag "sentry-v$VERSION"
          git push origin HEAD:master
          git push origin "sentry-v$VERSION"
