[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubit-otel"
version = "0.1.0"
description = "OpenTelemetry exporter for Kubit analytics."
requires-python = ">=3.9"
license = "MIT"

dependencies = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "boto3>=1.28.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
openai = ["opentelemetry-instrumentation-openai>=0.1.0"]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "moto[kinesis]>=4.0",
]

[tool.setuptools.packages.find]
include = ["kubit_otel*"]
